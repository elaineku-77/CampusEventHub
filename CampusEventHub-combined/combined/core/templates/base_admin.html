{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusEventHub Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding-top: 75px; /* IMPORTANT: prevent content hidden behind header */
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .admin-navbar {
            background-color: #2f2f4f;
            height: 70px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
        }

        .admin-logo {
            color: #ffd43b;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }

        .admin-logo:hover {
            color: #ffd43b;
        }

        .admin-nav-links {
            display: flex;
            gap: 35px;
        }

        .admin-nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        .admin-nav-links a:hover {
            color: #ffd43b;
        }

        .admin-right {
            display: flex;
            align-items: center;
            gap: 18px;
            color: white;
        }

        .logout-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .logout-btn:hover {
            color: #ffd43b;
        }

        .admin-user {
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-content {
            min-height: calc(100vh - 150px);
        }

        .footer {
            background-color: #2f2f4f;
            color: white;
            text-align: center;
            padding: 14px 0;
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<!-- ADMIN HEADER -->
<nav class="admin-navbar">
    <a href="{% url 'admin_dashboard' %}" class="admin-logo">CampusEventHub</a>

    <div class="admin-nav-links">
        <a href="{% url 'admin_dashboard' %}">Admin Dashboard</a>
        <a href="{% url 'admin_event_list' %}">Event Management</a>
        <a href="{% url 'admin_event_monitoring' %}">Event Monitoring</a>
    </div>

    <div class="admin-right">
        <a href="{% url 'admin_logout' %}" class="logout-btn">Logout</a>
        <div class="admin-user">👤 Admin</div>
    </div>
</nav>

<!-- PAGE CONTENT -->
<div class="main-content">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<footer class="footer">
    © 2026 WOC7014 Framework-Based Software Design and Development Group G. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
